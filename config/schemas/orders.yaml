primaryKey: orderId

fields:
  orderId:
    column: GTSORDERID
    type: integer

  documentId:
    column: DOCID
    type: string

  documentDate:
    column: DOCDATE
    type: date

  customer:
    column: CUSTOMER
    type: string

  netAmount:
    column: NETAMOUNT
    type: decimal

  orderStatus:
    column: ORDSTATUS
    type: string

  companyCode:
    column: COMPCODE
    type: integer

  financialYear:
    column: FINYEAR
    type: integer

policy:
  list: true
  get: true

  filters:
    - orderId
    - documentId
    - customer
    - companyCode
    - financialYear